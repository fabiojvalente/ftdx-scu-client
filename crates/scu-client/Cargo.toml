[package]
name = "scu-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scu-protocol.workspace = true
scu-cat.workspace = true
scu-audio.workspace = true
scu-scope.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rand.workspace = true
futures.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true

# Native transport drives real UDP sockets through Tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }

# The browser transport is one multiplexed WebSocket.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "console",
    "Event",
    "MessageEvent",
    "WebSocket",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing-subscriber]
workspace = true
