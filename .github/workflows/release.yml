name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            rustflags: ""
          # Build a universal (Intel + Apple Silicon) binary on the arm64
          # runner; GitHub no longer allocates the Intel macOS runners.
          - platform: macos-universal
            os: macos-latest
            target: universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            rustflags: ""
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            # Statically link the MSVC CRT so the .exe is self-contained.
            rustflags: "-C target-feature=+crt-static"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            libasound2-dev \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: runner.os != 'macOS'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p scu-app --target ${{ matrix.target }}

      - name: Build universal (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p scu-app --target aarch64-apple-darwin
          cargo build --release --locked -p scu-app --target x86_64-apple-darwin

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME//\//-}"

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications dist
          cp "target/${{ matrix.target }}/release/scu-app" AppDir/usr/bin/scu-app

          cat > AppDir/usr/share/applications/scu-app.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SCU-LAN10 Client
          Exec=scu-app
          Icon=scu-app
          Categories=Network;HamRadio;
          Terminal=false
          EOF

          # AppImage requires an icon; generate a placeholder PNG.
          python3 - <<'PY'
          import struct, zlib
          W = H = 256
          px = bytearray()
          for y in range(H):
              px.append(0)
              for x in range(W):
                  px += bytes((0, 200, 220, 255) if abs((x + y) - 255) < 40 else (18, 22, 30, 255))
          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(bytes(px), 9))
                 + chunk(b"IEND", b""))
          open("AppDir/scu-app.png", "wb").write(png)
          PY

          mkdir -p tools
          wget -q -O tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/linuxdeploy-plugin-appimage
          export PATH="$PWD/tools:$PATH"

          ./tools/linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/scu-app.desktop \
            --icon-file AppDir/scu-app.png \
            --output appimage

          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' | head -n1)"
          mv "$APPIMAGE" "dist/scu-app-${VERSION}-${{ matrix.platform }}.AppImage"

      - name: Package .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME//\//-}"
          APP="SCU-LAN10 Client.app"

          mkdir -p "$APP/Contents/MacOS" dist
          lipo -create \
            "target/aarch64-apple-darwin/release/scu-app" \
            "target/x86_64-apple-darwin/release/scu-app" \
            -output "$APP/Contents/MacOS/scu-app"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>SCU-LAN10 Client</string>
            <key>CFBundleDisplayName</key>
            <string>SCU-LAN10 Client</string>
            <key>CFBundleIdentifier</key>
            <string>com.fabiojvalente.scu-app</string>
            <key>CFBundleExecutable</key>
            <string>scu-app</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION#v}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/scu-app-${VERSION}-${{ matrix.platform }}.zip"

      - name: Package .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '/', '-'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/scu-app.exe" `
            -DestinationPath "dist/scu-app-$version-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scu-app-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
