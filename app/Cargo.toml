[package]
name = "scu-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scu-app"
path = "src/main.rs"

[dependencies]
scu-protocol.workspace = true
scu-cat.workspace = true
scu-scope.workspace = true
scu-audio.workspace = true
scu-client.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
web-time.workspace = true
egui_tiles = { version = "0.17", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.36.2"
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"] }
scu-rigctld.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "web_screen_reader",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Window",
] }
